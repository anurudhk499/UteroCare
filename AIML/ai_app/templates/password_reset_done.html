<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Email Sent — Nexora</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    background:linear-gradient(145deg,#e8f0fe 0%,#f3f8ff 40%,#eaf6f0 100%);

    font-family:'Sora',sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    overflow:hidden;

    position:relative;
}

.blob{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
}

.b1{
    width:450px;
    height:450px;
    background:rgba(99,179,237,0.25);

    top:-120px;
    left:-120px;
}

.b2{
    width:380px;
    height:380px;
    background:rgba(154,230,180,0.2);

    bottom:-100px;
    right:-100px;
}

.wrap{
    width:100%;
    max-width:430px;
    position:relative;
    z-index:2;
}

.card{

    background:rgba(255,255,255,0.65);

    backdrop-filter:blur(30px);

    border:1px solid rgba(255,255,255,0.8);

    border-radius:28px;

    padding:2.7rem;

    text-align:center;

    box-shadow:
    0 20px 60px rgba(100,130,200,0.12),
    0 4px 16px rgba(0,0,0,0.06);
}

.icon{

    width:74px;
    height:74px;

    margin:auto auto 22px;

    border-radius:22px;

    background:linear-gradient(145deg,#22c55e,#16a34a);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 14px 30px rgba(34,197,94,0.28);
}

.icon i{
    color:white;
    font-size:34px;
}

h1{
    font-size:28px;
    color:#1a2a4a;

    margin-bottom:12px;
}

p{

    font-size:14px;
    line-height:1.8;

    color:#7d8fb0;

    margin-bottom:2rem;
}

a{

    display:inline-block;

    padding:13px 24px;

    border-radius:14px;

    text-decoration:none;

    color:white;

    background:linear-gradient(160deg,#5a9eff,#2563eb);

    font-size:14px;
    font-weight:600;
}

</style>
</head>

<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="wrap">

    <div class="card">

        <div class="icon">
            <i class="ti ti-mail-check"></i>
        </div>

        <h1>Email Sent</h1>

        <p>
            We’ve emailed you instructions for resetting your password.
            Please check your inbox and follow the link.
        </p>

        <a href="{% url 'login' %}">
            Back to Login
        </a>

    </div>

</div>

</body>
</html>
