<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Changed — Nexora</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:linear-gradient(145deg,#e8f0fe 0%,#f3f8ff 40%,#eaf6f0 100%);

    font-family:'Sora',sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.card{

    width:100%;
    max-width:430px;

    background:rgba(255,255,255,0.68);

    backdrop-filter:blur(30px);

    padding:2.8rem;

    border-radius:28px;

    text-align:center;

    box-shadow:
    0 20px 60px rgba(100,130,200,0.12);
}

.icon{

    width:76px;
    height:76px;

    border-radius:22px;

    margin:auto auto 22px;

    background:linear-gradient(145deg,#22c55e,#16a34a);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 14px 30px rgba(34,197,94,0.25);
}

.icon i{
    color:white;
    font-size:36px;
}

h1{

    font-size:28px;
    color:#1a2a4a;

    margin-bottom:12px;
}

p{

    font-size:14px;

    line-height:1.8;

    color:#7d8fb0;

    margin-bottom:2rem;
}

a{

    display:inline-block;

    padding:14px 24px;

    border-radius:16px;

    text-decoration:none;

    color:white;

    font-size:14px;
    font-weight:600;

    background:
    linear-gradient(
        160deg,
        #5a9eff,
        #2563eb
    );
}

</style>
</head>

<body>

<div class="card">

    <div class="icon">

        <i class="ti ti-check"></i>

    </div>

    <h1>Password Updated</h1>

    <p>
        Your password has been changed successfully.
        You can now login using your new password.
    </p>

    <a href="{% url 'login' %}">
        Login Now
    </a>

</div>

</body>
</html>
