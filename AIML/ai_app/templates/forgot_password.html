<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password — Nexora</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:linear-gradient(145deg,#e8f0fe 0%,#f3f8ff 40%,#eaf6f0 100%);

    font-family:'Sora',sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    overflow:hidden;

    position:relative;
}

/* blobs */

.blob{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
}

.b1{
    width:450px;
    height:450px;
    background:rgba(99,179,237,0.25);

    top:-120px;
    left:-120px;
}

.b2{
    width:380px;
    height:380px;
    background:rgba(154,230,180,0.2);

    bottom:-100px;
    right:-100px;
}

.b3{
    width:240px;
    height:240px;
    background:rgba(183,148,244,0.16);

    top:40%;
    left:60%;
}

/* wrap */

.wrap{
    width:100%;
    max-width:430px;

    position:relative;
    z-index:2;
}

/* card */

.card{

    background:rgba(255,255,255,0.65);

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    border:1px solid rgba(255,255,255,0.8);

    border-radius:28px;

    padding:2.7rem;

    box-shadow:
    0 20px 60px rgba(100,130,200,0.12),
    0 4px 16px rgba(0,0,0,0.06),
    inset 0 1px 0 rgba(255,255,255,0.95);
}

/* icon */

.top-icon{

    width:72px;
    height:72px;

    border-radius:20px;

    background:linear-gradient(145deg,#5a9eff,#2563eb);

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:22px;

    box-shadow:
    0 12px 30px rgba(37,99,235,0.28);
}

.top-icon i{

    color:white;
    font-size:34px;
}

/* heading */

h1{

    font-size:28px;
    color:#1a2a4a;

    margin-bottom:10px;
}

.sub{

    font-size:14px;
    line-height:1.7;

    color:#7d8fb0;

    margin-bottom:2rem;
}

/* field */

.field{
    margin-bottom:1.4rem;
}

.field-label{

    display:block;

    font-size:12px;
    font-weight:600;

    color:#5f7396;

    margin-bottom:8px;

    letter-spacing:0.05em;
}

.inp-wrap{
    position:relative;
}

.inp-wrap i{

    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#b0bdd8;

    font-size:17px;
}

.inp-wrap input{

    width:100%;

    padding:13px 16px 13px 44px;

    border-radius:15px;

    border:1.5px solid #dbe5f4;

    background:white;

    outline:none;

    font-family:'Sora',sans-serif;
    font-size:14px;

    transition:0.22s;

    color:#1a2a4a;

    box-shadow:
    0 2px 8px rgba(79,142,247,0.05),
    inset 0 1px 2px rgba(0,0,0,0.03);
}

.inp-wrap input:focus{

    border-color:#4f8ef7;

    box-shadow:
    0 0 0 4px rgba(79,142,247,0.12),
    0 2px 8px rgba(79,142,247,0.1);
}

/* button */

.btn{

    width:100%;

    border:none;

    padding:14px;

    border-radius:16px;

    cursor:pointer;

    font-family:'Sora',sans-serif;

    font-size:14px;
    font-weight:600;

    color:white;

    background:
    linear-gradient(
        160deg,
        #5a9eff 0%,
        #3a7ef6 50%,
        #2563eb 100%
    );

    box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 6px 0 #1a4fc4,
    0 16px 30px rgba(58,126,246,0.25);

    transition:0.2s;
}

.btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 8px 0 #1a4fc4,
    0 22px 40px rgba(58,126,246,0.3);
}

.btn:active{

    transform:translateY(3px);

    box-shadow:
    0 2px 0 #1a4fc4,
    0 8px 16px rgba(58,126,246,0.18);
}

/* footer */

.back{

    text-align:center;

    margin-top:1.6rem;

    font-size:13px;

    color:#8a9cc0;
}

.back a{

    color:#4f8ef7;

    text-decoration:none;

    font-weight:500;
}

/* mobile */

@media(max-width:500px){

    .card{
        padding:2rem 1.5rem;
        border-radius:24px;
    }

    h1{
        font-size:24px;
    }

}

</style>
</head>

<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="wrap">

    <div class="card">

        <div class="top-icon">

            <i class="ti ti-lock-question"></i>

        </div>

        <h1>Forgot Password?</h1>

        <p class="sub">
            No worries. Enter your registered email address and we’ll send you a password reset link.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="field">

                <label class="field-label">
                    EMAIL ADDRESS
                </label>

                <div class="inp-wrap">

                    <i class="ti ti-mail"></i>

                    {{ form.email }}

                </div>

            </div>

            <button type="submit" class="btn">

                <i class="ti ti-send"></i>

                Send Reset Link

            </button>

        </form>

        <p class="back">

            Remembered your password?

            <a href="{% url 'login' %}">
                Back to Login
            </a>

        </p>

    </div>

</div>

</body>
</html>
