<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Set New Password — Nexora</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:linear-gradient(145deg,#e8f0fe 0%,#f3f8ff 40%,#eaf6f0 100%);

    font-family:'Sora',sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.card{

    width:100%;
    max-width:430px;

    background:rgba(255,255,255,0.7);

    backdrop-filter:blur(30px);

    padding:2.7rem;

    border-radius:28px;

    box-shadow:
    0 20px 60px rgba(100,130,200,0.12);
}

h1{

    font-size:28px;
    color:#1a2a4a;

    margin-bottom:10px;
}

.sub{

    color:#7d8fb0;

    font-size:14px;

    margin-bottom:2rem;
}

form p{
    margin-bottom:1rem;
}

form label{

    display:block;

    margin-bottom:8px;

    font-size:13px;
    font-weight:600;

    color:#5f7396;
}

form input{

    width:100%;

    padding:13px;

    border-radius:14px;

    border:1.5px solid #dbe5f4;

    outline:none;

    font-family:'Sora',sans-serif;
}

button{

    width:100%;

    margin-top:10px;

    padding:14px;

    border:none;

    border-radius:16px;

    color:white;

    cursor:pointer;

    font-size:14px;
    font-weight:600;

    background:
    linear-gradient(
        160deg,
        #5a9eff,
        #2563eb
    );
}

</style>
</head>

<body>

<div class="card">

    <h1>Create New Password</h1>

    <p class="sub">
        Your new password must be secure and different from previous passwords.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>

    </form>

</div>

</body>
</html>
